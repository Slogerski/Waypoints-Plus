name: Build

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build and collect release artifacts
        run: ./gradlew buildAll assembleModrinthArtifacts

      - name: Upload Modrinth-ready JAR
        uses: actions/upload-artifact@v6
        with:
          name: waypoints-plus-modrinth
          path: build/modrinth/*.jar
          if-no-files-found: error

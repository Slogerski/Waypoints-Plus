def platformSpec = gradle.ext.waypointsVersionManifest.versions.find {
    it.project == project.name
}
if (platformSpec == null || platformSpec.status != "active") {
    throw new GradleException("No active version manifest entry for ${project.path}")
}
if (platformSpec.mappingType != "yarn") {
    throw new GradleException("${project.path} must use Yarn mappings")
}

def minecraftVersion = platformSpec.minecraft ?: platformSpec.gameVersions.last()
def minecraftRequirement = platformSpec.gameVersions.size() == 1
    ? platformSpec.gameVersions.first()
    : ">=${platformSpec.gameVersions.first()} <=${platformSpec.gameVersions.last()}"
def javaVersion = platformSpec.java as Integer
def fabricLoaderVersion = platformSpec.fabricLoader as String
def codeFamilies = [
    "1.19.2": "yarn-legacy",
    "1.20.1": "yarn-1.20.1",
    "1.20.6": "yarn-modern",
    "1.21.1": "yarn-modern",
    "1.21.2-1.21.4": "yarn-modern",
    "1.21.5": "yarn-modern",
    "1.21.6": "yarn-modern",
    "1.21.8": "yarn-modern",
    "1.21.10": "yarn-modern",
    "1.21.11": "yarn-modern"
]
def textureBackends = [
    "1.19.2": "yarn-dynamic",
    "1.20.1": "yarn-dynamic",
    "1.20.6": "yarn-dynamic",
    "1.21.1": "yarn-dynamic",
    "1.21.2-1.21.4": "yarn-registered",
    "1.21.5": "yarn-supplier",
    "1.21.6": "yarn-supplier",
    "1.21.8": "yarn-supplier",
    "1.21.10": "yarn-supplier",
    "1.21.11": "yarn-supplier"
]
if (!codeFamilies.containsKey(platformSpec.id) || !textureBackends.containsKey(platformSpec.id)) {
    throw new GradleException("No explicit code family for ${platformSpec.id}")
}

base {
    archivesName = "waypoints-plus-mc${platformSpec.id}-fabric"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(javaVersion)
    }
}

sourceSets {
    main {
        java.srcDir(project(":common").file("src/main/java"))
        java.srcDir(rootProject.file("platforms/fabric/common/src/main/java"))
        java.srcDir(rootProject.file("platforms/fabric/${codeFamilies[platformSpec.id]}/src/main/java"))
        java.srcDir(rootProject.file(
            "platforms/fabric/remote-texture/${textureBackends[platformSpec.id]}/src/main/java"
        ))
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraftVersion}"
    mappings "net.fabricmc:yarn:${platformSpec.yarn}:v2"
    modImplementation "net.fabricmc:fabric-loader:${fabricLoaderVersion}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${platformSpec.fabricApi}"
    implementation "com.google.code.gson:gson:${gson_version}"
}

processResources {
    inputs.properties(
        "version": project.version,
        "minecraft_requirement": minecraftRequirement,
        "java_version": javaVersion
    )
    from(rootProject.file("LICENSE")) {
        rename { "LICENSE_${mod_id}" }
    }
    filesMatching("fabric.mod.json") {
        expand(
            "version": project.version,
            "minecraft_requirement": minecraftRequirement,
            "java_version": javaVersion,
            "fabric_loader": fabricLoaderVersion,
            "mod_id": mod_id,
            "mod_name": mod_name,
            "mod_description": mod_description,
            "mod_authors": mod_authors,
            "mod_license": mod_license
        )
    }
}
